[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privateprocureai"
version = "0.1.0"
description = "A multi-agent AI procurement and planning system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PrivateProcureAI contributors" },
]
dependencies = [
    "chromadb>=1.0", 
    "google-genai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]